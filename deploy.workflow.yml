# Builds the site and publishes it to GitHub Pages.
#
# INACTIVE. GitHub only runs workflows stored in .github/workflows/, and this file
# deliberately lives at the repo root so that nothing can deploy by accident while the
# content is still being confirmed.
#
# To activate it at launch:
#   1. mkdir -p .github/workflows && git mv deploy.workflow.yml .github/workflows/deploy.yml
#      (pushing that path needs the `workflow` OAuth scope: `gh auth refresh -h github.com -s workflow`,
#       run from a normal terminal — or just paste this file in via the GitHub web UI)
#   2. Repository -> Settings -> Pages -> Source: "GitHub Actions"
#   3. Push to the default branch, or run the workflow manually.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
